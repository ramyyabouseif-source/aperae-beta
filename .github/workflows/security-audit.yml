name: Security Audit

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    # Run weekly on Mondays at 9 AM UTC
    - cron: '0 9 * * 1'
  workflow_dispatch:

jobs:
  audit-backend:
    name: Audit Backend Dependencies
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run npm audit
        id: audit
        run: |
          npm audit --audit-level=moderate --json > audit-report.json || true
          npm audit --audit-level=moderate
        continue-on-error: true
      
      - name: Upload audit results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-audit-results
          path: backend/audit-report.json
          retention-days: 30
      
      - name: Comment PR with audit results
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const auditReport = JSON.parse(fs.readFileSync('backend/audit-report.json', 'utf8'));
            
            const { vulnerabilities } = auditReport;
            const counts = {
              critical: vulnerabilities?.critical || 0,
              high: vulnerabilities?.high || 0,
              moderate: vulnerabilities?.moderate || 0,
              low: vulnerabilities?.low || 0,
              info: vulnerabilities?.info || 0,
            };
            
            const total = Object.values(counts).reduce((a, b) => a + b, 0);
            
            let comment = '## 🔒 Backend Security Audit Results\n\n';
            comment += `**Total vulnerabilities:** ${total}\n\n`;
            comment += `- 🔴 Critical: ${counts.critical}\n`;
            comment += `- 🟠 High: ${counts.high}\n`;
            comment += `- 🟡 Moderate: ${counts.moderate}\n`;
            comment += `- 🔵 Low: ${counts.low}\n`;
            comment += `- ⚪ Info: ${counts.info}\n\n`;
            
            if (total === 0) {
              comment += '✅ No vulnerabilities found!\n';
            } else {
              comment += '⚠️ **Action Required:** Please review and fix vulnerabilities.\n';
              comment += 'Run `npm audit fix` to attempt automatic fixes.\n';
            }
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

  audit-frontend:
    name: Audit Frontend Dependencies
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run npm audit
        id: audit
        run: |
          npm audit --audit-level=moderate --json > audit-report.json || true
          npm audit --audit-level=moderate
        continue-on-error: true
      
      - name: Upload audit results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-audit-results
          path: audit-report.json
          retention-days: 30
      
      - name: Comment PR with audit results
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const auditReport = JSON.parse(fs.readFileSync('audit-report.json', 'utf8'));
            
            const { vulnerabilities } = auditReport;
            const counts = {
              critical: vulnerabilities?.critical || 0,
              high: vulnerabilities?.high || 0,
              moderate: vulnerabilities?.moderate || 0,
              low: vulnerabilities?.low || 0,
              info: vulnerabilities?.info || 0,
            };
            
            const total = Object.values(counts).reduce((a, b) => a + b, 0);
            
            let comment = '## 🔒 Frontend Security Audit Results\n\n';
            comment += `**Total vulnerabilities:** ${total}\n\n`;
            comment += `- 🔴 Critical: ${counts.critical}\n`;
            comment += `- 🟠 High: ${counts.high}\n`;
            comment += `- 🟡 Moderate: ${counts.moderate}\n`;
            comment += `- 🔵 Low: ${counts.low}\n`;
            comment += `- ⚪ Info: ${counts.info}\n\n`;
            
            if (total === 0) {
              comment += '✅ No vulnerabilities found!\n';
            } else {
              comment += '⚠️ **Action Required:** Please review and fix vulnerabilities.\n';
              comment += 'Run `npm audit fix` to attempt automatic fixes.\n';
            }
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.issue.owner,
              repo: context.issue.repo,
              body: comment
            });

  audit-summary:
    name: Security Audit Summary
    runs-on: ubuntu-latest
    needs: [audit-backend, audit-frontend]
    if: always()
    
    steps:
      - name: Download audit results
        uses: actions/download-artifact@v4
        with:
          pattern: '*-audit-results'
          merge-multiple: false
      
      - name: Generate summary
        run: |
          echo "## Security Audit Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ Backend audit: ${{ needs.audit-backend.result }}" >> $GITHUB_STEP_SUMMARY
          echo "✅ Frontend audit: ${{ needs.audit-frontend.result }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "View detailed results in the artifacts above." >> $GITHUB_STEP_SUMMARY
      
      - name: Fail if critical vulnerabilities found
        if: needs.audit-backend.result == 'failure' || needs.audit-frontend.result == 'failure'
        run: |
          echo "⚠️ Critical or high vulnerabilities detected!"
          echo "Please review and fix before merging."
          exit 1


